[project]
name = "proxigen-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MaazZarif", email = "maazbangash2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.12",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
proxigen-rag = "proxigen_rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
